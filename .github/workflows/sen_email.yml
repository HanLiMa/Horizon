name: Daily Email Sender

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. 先运行一遍原项目的抓取
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: "https://example.com"
        run: uv run horizon --hours 24

      # 2. 发送邮件
      - name: Send Email with Python
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python -c "
          import smtplib, os, glob
          from email.mime.text import MIMEText
          from email.header import Header

          files = glob.glob('data/summaries/*-zh.md')
          if not files:
              print('没有找到日报文件！')
              exit(1)
          
          latest_file = sorted(files)[-1]
          with open(latest_file, 'r', encoding='utf-8') as f:
              content = f.read()

          sender = os.environ['EMAIL_USER']
          password = os.environ['EMAIL_PASS']
          receiver = os.environ['TO_EMAIL']

          msg = MIMEText(content, 'plain', 'utf-8')
          msg['Subject'] = Header(f'你的专属AI日报 ({latest_file.split(\"/\")[-1]})', 'utf-8')
          msg['From'] = sender
          msg['To'] = receiver

          try:
              smtp = smtplib.SMTP_SSL('smtp.qq.com', 465)
              smtp.login(sender, password)
              smtp.sendmail(sender, [receiver], msg.as_string())
              smtp.quit()
              print('邮件发送成功！')
          except Exception as e:
              print(f'发送失败: {e}')
              exit(1)
          "
