name: My Daily AI Digest

on:
  schedule:
    - cron: '0 23 * * *' # 每天北京时间早上 7 点运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Send Email directly
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          pip install requests
          python -c "
          import os, requests, smtplib
          from email.mime.text import MIMEText
          from email.header import Header

          # --- 核心修改：用 .strip() 去掉所有环境变量前后的不可见空格/换行符 ---
          api_key = os.environ['DEEPSEEK_API_KEY'].strip()
          sender = os.environ['EMAIL_USER'].strip()
          password = os.environ['EMAIL_PASS'].strip()
          receiver = os.environ['TO_EMAIL'].strip()

          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json'
          }
          prompt = '''你是一名学术研究助理和计算机网络原理教师。请分别输出以下两个任务：
          任务一：用简短的要点，总结最近关于 First Order Motion Model (FOMM) 或 姿态迁移(Pose Transfer)、动画生成的最新研究趋势（列出2-3个具体方向）。
          任务二：给出一个计算机网络领域的近期前沿热点案例，说明它对应课本章节里的哪个知识点，并给出1个用于课堂讨论的问题。'''
          data = {'model': 'deepseek-chat', 'messages': [{'role': 'user', 'content': prompt}]}
          
          res = requests.post('https://api.deepseek.com/v1/chat/completions', headers=headers, json=data)
          result = res.json()
          
          if 'choices' not in result:
              print('AI 接口报错:', result)
              exit(1)
              
          content = result['choices'][0]['message']['content']

          # 发邮件
          msg = MIMEText(content, 'plain', 'utf-8')
          msg['Subject'] = Header('你的专属 FOMM 与网络教学简报', 'utf-8')
          msg['From'] = sender
          msg['To'] = receiver

          smtp = smtplib.SMTP_SSL('smtp.qq.com', 465)
          smtp.login(sender, password)
          smtp.sendmail(sender, [receiver], msg.as_string())
          smtp.quit()
          print('邮件发送成功！')
          "
