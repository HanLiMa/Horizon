# Hugging Face 每日论文榜（社区投票筛选）。据社区项目 papers-api 的说法，
# HF 官方没有提供 RSS，这个地址很可能 404，用之前先在日志里确认。
[[feeds]]
name = "HF-Daily-Papers"
url = "https://huggingface.co/papers/feed.xml"
tag = "视觉动画"
max_items = 5
enabled = true
keywords = ["face", "avatar", "portrait", "animation", "motion", "diffusion",
