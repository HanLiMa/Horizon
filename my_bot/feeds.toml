# ============================================================
# 每日简报的信息源配置
# 只改这个文件，不用动 main.py。
#
# 每个 [[feeds]] 是一路源，字段含义：
#   name      日志里显示的名字（随便起，不参与逻辑）
#   url       RSS / Atom 地址
#   tag       打给 AI 的分类标记，只有这三个值有用：
#             "视觉动画"  -> 提示词【模块一】
#             "网络前沿"  -> 提示词【模块二】
#             "大厂八卦"  -> 提示词【模块三】
#   keywords  标题关键词过滤，命中任意一个才收录；写成 keywords = [] 表示不过滤，全收
#   max_items 这一路源最多收几条，防止 token 爆炸
#   enabled   改成 false 就临时停用这一路，不用删配置
#
# 提醒：arXiv 的 RSS 目前（2026-10）服务端返回空，跑起来会看到 0 条，
#       可以先留着，等它恢复；也可以之后换成 export.arxiv.org 的 API。
# ============================================================

# ---------- 视觉 / 动画（FOMM 方向） ----------

[[feeds]]
name = "arXiv-CV"
url = "https://rss.arxiv.org/rss/cs.CV"
tag = "视觉动画"
max_items = 5
enabled = true
keywords = [
  "pose", "animation", "motion", "avatar", "fomm", "reconstruction",
  "diffusion", "gaussian", "nerf", "implicit", "image generation",
  "image animation", "pose transfer", "video generation",
  # 补的 FOMM 近义词，嫌噪音大可删
  "talking head", "portrait", "reenact",
]

# arXiv 官方 API（RSS 停摆时是唯一能拿到当天新论文的通道）
# 查询写在 URL 里，服务端按「分类 + 摘要关键词」筛完再返回，所以 keywords 留空。
# 注意：URL 里不能有空格，空格用 + 表示，引号写成 %22，否则 feedparser 会抛 InvalidURL。
[[feeds]]
name = "arXiv-API-CV"
url = "https://export.arxiv.org/api/query?search_query=cat:cs.CV+AND+(abs:avatar+OR+abs:%22talking+head%22+OR+abs:portrait+OR+abs:reenactment+OR+abs:%22face+animation%22+OR+abs:%22pose+transfer%22)&sortBy=submittedDate&sortOrder=descending&max_results=10"
tag = "视觉动画"
max_items = 5
enabled = true
keywords = []

# ---- 下面这段是上面 URL 里的查询式，方便你改 ----
#   cat:cs.CV                                  只在这个分类里找
#   AND ( abs:avatar OR abs:%22talking+head%22 ... )  摘要命中任一即可
#   sortBy=submittedDate&sortOrder=descending  最新提交优先
#   max_results=10                             多取几条，代码再按 max_items 截断

[[feeds]]
name = "arXiv-GR"
url = "https://rss.arxiv.org/rss/cs.GR"
tag = "视觉动画"
max_items = 5
enabled = true
keywords = [
  "pose", "animation", "motion", "avatar", "reconstruction",
  "diffusion", "gaussian", "nerf", "implicit", "deformation",
  "talking head", "portrait", "reenact",
]

# 同上的 API 版本，检索式换到图形学分类
