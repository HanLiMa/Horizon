# ============================================================
# 每日简报的信息源配置
# 只改这个文件，不用动 main.py。
#
# 每个 [[feeds]] 是一路源，字段含义：
#   name      日志里显示的名字（随便起，不参与逻辑）
#   url       RSS / Atom 地址
#   tag       打给 AI 的分类标记，只有这三个值有用：
#             "视觉动画"  -> 提示词【模块一】
#             "网络前沿"  -> 提示词【模块二】
#             "大厂八卦"  -> 提示词【模块三】
#   keywords  标题关键词过滤，命中任意一个才收录；写成 keywords = [] 表示不过滤，全收
#   max_items 这一路源最多收几条，防止 token 爆炸
#   enabled   改成 false 就临时停用这一路，不用删配置
#
# 提醒：arXiv 的 RSS 目前（2026-10）服务端返回空，跑起来会看到 0 条，
#       可以先留着，等它恢复；也可以之后换成 export.arxiv.org 的 API。
# ============================================================

# ---------- 视觉 / 动画（FOMM 方向） ----------

[[feeds]]
name = "arXiv-CV"
url = "http://rss.arxiv.org/rss/cs.CV"
tag = "视觉动画"
max_items = 5
enabled = true
keywords = [
  "pose", "animation", "motion", "avatar", "fomm", "reconstruction",
  "diffusion", "gaussian", "nerf", "implicit", "image generation",
  "image animation", "pose transfer", "video generation",
  # 补的 FOMM 近义词，嫌噪音大可删
  "talking head", "portrait", "reenact",
]

[[feeds]]
name = "arXiv-GR"
url = "http://rss.arxiv.org/rss/cs.GR"
tag = "视觉动画"
max_items = 5
enabled = true
keywords = [
  "pose", "animation", "motion", "avatar", "reconstruction",
  "diffusion", "gaussian", "nerf", "implicit", "deformation",
  "talking head", "portrait", "reenact",
]

